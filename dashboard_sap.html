<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard SAP — Operaciones</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f0f2f5;--surface:#ffffff;--border:#e2e8f0;--card-bg:#ffffff;--accent:#FFD700;--red:#E63B2E;--orange:#f97316;--blue:#3b82f6;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--green:#16a34a;--topbar:#0f172a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:0 0 48px;}
  .topbar{background:var(--topbar);border-bottom:3px solid var(--accent);padding:14px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15);}
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .logo-img{height:50px;width:50px;object-fit:contain;border-radius:8px;}
  .topbar-title h1{font-size:20px;font-weight:800;color:#ffffff;letter-spacing:-0.3px;}
  .topbar-title h1 span{color:var(--accent);}
  .topbar-meta{font-family:'DM Mono',monospace;font-size:11px;color:#94a3b8;margin-top:3px;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .periodo-badge{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);border-radius:8px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);white-space:nowrap;}
  .btn-acumulado{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);border-radius:8px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);white-space:nowrap;cursor:pointer;transition:.15s;}
  .btn-acumulado:hover{background:rgba(255,215,0,.3);}
  .buscador-wrap{display:flex;align-items:center;gap:6px;}
  #buscador-cuadrilla{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 10px;font-size:12px;color:#fff;width:150px;font-family:'DM Mono',monospace;}
  #buscador-cuadrilla::placeholder{color:rgba(255,255,255,.45);}
  .btn-buscar{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--accent);font-size:13px;}
  .btn-buscar:hover{background:rgba(255,215,0,.3);}
  .ficha-nombre{font-size:22px;font-weight:800;color:var(--text);}
  .ficha-meta{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin-top:6px;margin-bottom:22px;}
  .select-wrap{position:relative;}
  select{appearance:none;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:7px 32px 7px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#ffffff;cursor:pointer;outline:none;transition:border-color .2s;}
  select:hover,select:focus{border-color:var(--accent);}
  .select-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--accent);font-size:10px;}
  .main-content{padding:24px 32px;}
  .app-split{display:flex;gap:20px;align-items:flex-start;}
  .panel-izq{flex:0 0 30%;display:flex;flex-direction:column;gap:20px;position:sticky;top:90px;min-width:280px;}
  .panel-der{flex:1;min-width:0;background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);min-height:200px;}
  @media(max-width:1000px){.app-split{flex-direction:column;}.panel-izq{flex:1 1 auto;position:static;width:100%;min-width:0;}.main-content{padding:16px;}.topbar{padding:12px 16px;}}
  .grupo-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:fadeUp .4s ease both;box-shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);}
  .card-omf{border-top:4px solid var(--accent);animation-delay:.05s;}
  .card-construcciones{border-top:4px solid var(--red);animation-delay:.10s;}
  .card-soporte{border-top:4px solid var(--orange);animation-delay:.15s;}
  .card-tg{border-top:4px solid var(--blue);animation-delay:.20s;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .grupo-header{padding:16px 22px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:#fafbfc;}
  .grupo-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .card-omf .grupo-dot{background:var(--accent);}
  .card-construcciones .grupo-dot{background:var(--red);}
  .card-soporte .grupo-dot{background:var(--orange);}
  .card-tg .grupo-dot{background:var(--blue);}
  .grupo-nombre{font-size:15px;font-weight:700;color:var(--text);}
  .metricas{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border);}
  .metrica{padding:16px 6px;border-right:1px solid var(--border);text-align:center;background:#ffffff;}
  .metrica:last-child{border-right:none;}
  .metrica-valor{font-family:'DM Mono',monospace;font-size:24px;font-weight:700;line-height:1;margin-bottom:6px;}
  .metrica-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600;}
  .metrica.aprobados .metrica-valor{color:var(--green);}
  .metrica.sin-aprobar .metrica-valor{color:var(--red);}
  .metrica.anulados .metrica-valor{color:#64748b;}
  .metrica.descuentos .metrica-valor{color:#d97706;}
  .stat-mini-row{padding:10px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#fffbeb;}
  .stat-mini-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
  .stat-mini-valor{font-family:'DM Mono',monospace;font-size:13px;color:#b45309;font-weight:700;}
  .ver-detalle{padding:12px 22px;font-size:12px;color:var(--blue);font-weight:700;cursor:pointer;text-align:center;background:#fafbfc;}
  .ver-detalle:hover{background:#f0f2f5;text-decoration:underline;}
  .horas-row{padding:12px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#fffbeb;}
  .horas-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;font-weight:600;}
  .horas-valor{font-family:'DM Mono',monospace;font-size:17px;color:#b45309;font-weight:700;}
  .chart-section{padding:18px 22px 22px;background:#ffffff;}
  .chart-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .chart-container{display:flex;gap:20px;align-items:center;}
  .donut-wrap{flex-shrink:0;position:relative;}
  .donut-wrap svg{display:block;}
  .donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .donut-center-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:var(--text);line-height:1;}
  .donut-center-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px;}
  .leyenda{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
  .leyenda-item{display:flex;align-items:center;gap:8px;font-size:12px;}
  .leyenda-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0;}
  .leyenda-nombre{flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
  .leyenda-hs{font-family:'DM Mono',monospace;font-size:11px;color:#475569;flex-shrink:0;font-weight:500;}
  .no-descuentos{font-size:12px;color:var(--muted);font-style:italic;padding:8px 0;}
  .sin-datos{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
  .grupo-header{cursor:pointer;}
  .grupo-header:hover{background:#f0f2f5;}
  .leyenda-item{cursor:pointer;border-radius:6px;padding:3px 4px;margin:-3px -4px;transition:background .15s;}
  .leyenda-item:hover{background:#f0f2f5;}
  .drilldown{display:none;}
  .pills-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .pill{padding:8px 16px;border-radius:20px;background:#ffffff;border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;color:var(--text2);transition:.15s;}
  .pill:hover{border-color:var(--accent);color:var(--text);}
  .pill-activo{background:var(--topbar);color:#ffffff;border-color:var(--topbar);}
  .btn-volver{background:none;border:none;color:var(--blue);font-size:13px;font-weight:700;cursor:pointer;padding:0 0 18px;display:flex;align-items:center;gap:5px;}
  .btn-volver:hover{text-decoration:underline;}
  .ref-card{background:#fafbfc;border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:22px;}
  .graficos-grupo{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:26px;}
  .grafico-box{flex:1 1 300px;background:#ffffff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .motivo-destacado{font-size:16px;font-weight:700;margin-top:8px;color:var(--text);}
  .motivo-hs{font-family:'DM Mono',monospace;font-size:26px;font-weight:700;color:#d97706;margin-top:6px;}
  .motivo-pct{font-size:12px;color:var(--muted);margin-top:4px;}
  .mini-metricas{margin-top:12px;font-size:12px;color:var(--text2);display:flex;flex-wrap:wrap;gap:20px;}
  .mini-metricas b{color:var(--text);font-family:'DM Mono',monospace;font-size:14px;}
  .panel-der-placeholder{color:var(--muted);font-size:13px;padding:60px 20px;text-align:center;}
  .ranking-titulo{font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .ranking-titulo-sin-borde{font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
  .ranking-header-tabs{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .tabs-ranking-bar{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-ranking{padding:6px 12px;border-radius:8px;background:#eef1f5;color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s;border:1px solid transparent;}
  .tab-ranking:hover{background:#e2e8f0;}
  .tab-ranking-activo{background:#ffffff;color:var(--text);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .ranking-tabla{width:100%;border-collapse:collapse;font-size:13px;}
  .ranking-tabla th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
  .ranking-tabla td{padding:9px 10px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;}
  .ranking-tabla th:nth-child(1),.ranking-tabla td:nth-child(1){color:var(--muted);width:32px;}
  .ranking-tabla tbody tr:hover{background:#fafbfc;}
  .barras-chart{display:flex;flex-direction:column;gap:11px;margin-bottom:26px;padding-bottom:22px;}
  .barras-header{display:grid;grid-template-columns:22px 90px 56px 1fr 66px 92px;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--border);}
  .barras-header div{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .barras-header .col-right{text-align:right;}
  .barra-row{display:grid;grid-template-columns:22px 90px 56px 1fr 66px 92px;align-items:center;gap:12px;}
  .barra-rank{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-align:right;}
  .barra-label{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .barra-base{font-size:12px;color:var(--text2);font-weight:600;}
  .barra-track{background:#eef1f5;border-radius:6px;height:20px;overflow:hidden;}
  .barra-fill{background:linear-gradient(90deg,#1e3a5f,#2563eb);height:100%;border-radius:6px;transition:width .4s ease;}
  .barra-valor{font-family:'DM Mono',monospace;font-size:12px;color:var(--text);text-align:right;font-weight:600;}
  .barra-partes{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);text-align:right;}
  .barras-titulo{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;}
</style>
</head>

function generarDonut(motivos,nombreGrupo,size=120){
  if(!motivos||!motivos.length)return null;
  const total=motivos.reduce((s,m)=>s+m.hs,0);
  if(!total)return null;
  const cx=size/2,cy=size/2,grosor=Math.max(size*0.18,14),radio=cx-grosor/2-3,GAP=motivos.length>1?2:0;
  let angulo=-90,paths="";
  motivos.forEach((item,i)=>{
    const pct=item.hs/total,grados=pct*360,anguloFin=angulo+grados-GAP;
    const r1=angulo*Math.PI/180,r2=anguloFin*Math.PI/180;
    const x1=+(cx+radio*Math.cos(r1)).toFixed(4),y1=+(cy+radio*Math.sin(r1)).toFixed(4);
    const x2=+(cx+radio*Math.cos(r2)).toFixed(4),y2=+(cy+radio*Math.sin(r2)).toFixed(4);
    const large=(grados-GAP)>180?1:0,color=PALETA[i%PALETA.length];
    const motivoAttr=item.motivo.replace(/'/g,"\\'");
    paths+=`<path d="M ${x1} ${y1} A ${radio} ${radio} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${grosor}" stroke-linecap="butt" style="cursor:pointer" onclick="abrirDrilldownMotivo('${nombreGrupo}','${motivoAttr}')"><title>${item.motivo}</title></path>`;
    angulo+=grados;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${radio}" fill="none" stroke="#cbd5e1" stroke-width="${grosor}"/>${paths}</svg>`;
}
// Promedio y Mediana de OT x Día: a partir de la lista de "cantidad de
// valores H distintos por parte" (ot_lista), ya sea de un solo período o
// del acumulado (donde ot_lista viene concatenada de todos los períodos).
function calcularMedia(lista){
  if(!lista||!lista.length)return 0;
  return lista.reduce((s,v)=>s+v,0)/lista.length;
}
function calcularMediana(lista){
  if(!lista||!lista.length)return 0;
  const ordenado=[...lista].sort((a,b)=>a-b);
  const mid=Math.floor(ordenado.length/2);
  return ordenado.length%2!==0?ordenado[mid]:(ordenado[mid-1]+ordenado[mid])/2;
}

function renderGrupo(nombre,datos){
  const cardClass=CARD_CLASS[nombre]||"";
  const metricas=`<div class="metricas">
    <div class="metrica aprobados"><div class="metrica-valor">${datos.aprobados}</div><div class="metrica-label">Aprobados</div></div>
    <div class="metrica sin-aprobar"><div class="metrica-valor">${datos.sin_aprobar}</div><div class="metrica-label">Sin Aprobar</div></div>
    <div class="metrica descuentos"><div class="metrica-valor">${datos.con_descuento}</div><div class="metrica-label">Con Desc.</div></div>
    <div class="metrica anulados"><div class="metrica-valor">${datos.anulados}</div><div class="metrica-label">Anulados</div></div>
  </div>`;

  // Todas las líneas se expresan como % sobre el total de horas
  // (Tiempo Operativo + Tiempo No Operativo) — es el total representativo.
  const top=datos.tiempo_operativo||0, tnop=datos.tiempo_no_operativo||0, totalHoras=top+tnop;
  const traslados=datos.tiempo_traslados||0, prp=datos.tiempo_prp||0;
  const hsDescontadas=datos.horas_descontadas||0;

  // Eficiencia del grupo: % de partes SIN descuento sobre el total de partes.
  const totalPartesGrupo=(datos.aprobados||0)+(datos.sin_aprobar||0)+(datos.anulados||0);
  const eficienciaGrupo=totalPartesGrupo>0?(100-(datos.con_descuento||0)/totalPartesGrupo*100):null;

  let filasStats;
  if(totalHoras>0){
    const pctHsDesc=(hsDescontadas/totalHoras*100).toFixed(1);
    const pctOp=(top/totalHoras*100).toFixed(1);
    const pctTraslados=(traslados/totalHoras*100).toFixed(1);
    const pctPrp=(prp/totalHoras*100).toFixed(1);
    filasStats=`<div class="horas-row"><span class="horas-label">% Hs Descontadas</span><span class="horas-valor">${pctHsDesc}%</span></div>
      <div class="stat-mini-row"><span class="stat-mini-label">Eficiencia</span><span class="stat-mini-valor">${eficienciaGrupo!==null?eficienciaGrupo.toFixed(1)+"%":"-"}</span></div>
      <div class="stat-mini-row"><span class="stat-mini-label">% Tiempo Operativo</span><span class="stat-mini-valor">${pctOp}%</span></div>
      <div class="stat-mini-row"><span class="stat-mini-label">% Tiempos de Traslado</span><span class="stat-mini-valor">${pctTraslados}%</span></div>
      <div class="stat-mini-row"><span class="stat-mini-label">% Tiempos de PRP</span><span class="stat-mini-valor">${pctPrp}%</span></div>`;
  }else{
    // Sin datos de tiempo operativo/no operativo todavía — se muestra el
    // valor absoluto como respaldo en vez de un % sin base para calcularlo.
    filasStats=`<div class="horas-row"><span class="horas-label">Total Horas Descontadas</span><span class="horas-valor">${hsDescontadas.toFixed(2)} hs</span></div>
      <div class="stat-mini-row"><span class="stat-mini-label">Eficiencia</span><span class="stat-mini-valor">${eficienciaGrupo!==null?eficienciaGrupo.toFixed(1)+"%":"-"}</span></div>`;
  }

  // Promedio de OT x Día (cant. de valores H distintos por parte) — se sacó
  // la Mediana del dashboard, no aportaba diferencia significativa.
  const otLista=datos.ot_lista||[];
  if(otLista.length){
    const promedioOt=calcularMedia(otLista).toFixed(2);
    filasStats+=`<div class="stat-mini-row"><span class="stat-mini-label">Promedio de OT x Día</span><span class="stat-mini-valor">${promedioOt}</span></div>`;
  }

  return `<div class="grupo-card ${cardClass}">
    <div class="grupo-header" onclick="abrirDrilldownGrupo('${nombre}')"><div class="grupo-dot"></div><div class="grupo-nombre">${nombre}</div></div>
    ${metricas}${filasStats}
    <div class="ver-detalle" onclick="abrirDrilldownGrupo('${nombre}')">Ver gráficos y ranking completo →</div>
  </div>`;
}

// Donut genérico de N categorías con color fijo (sin interacción/click) —
// usado para la torta comparativa Operativo vs Traslados vs PRP.
function generarDonutGenerico(items,size=90){
  const validos=items.filter(i=>i.valor>0);
  const total=validos.reduce((s,i)=>s+i.valor,0);
  if(total<=0)return null;
  const cx=size/2,cy=size/2,grosor=Math.max(size*0.22,14),radio=cx-grosor/2-3,GAP=validos.length>1?2:0;
  let angulo=-90,paths="";
  validos.forEach(item=>{
    const grados=item.valor/total*360,anguloFin=angulo+grados-GAP;
    const r1=angulo*Math.PI/180,r2=anguloFin*Math.PI/180;
    const x1=+(cx+radio*Math.cos(r1)).toFixed(4),y1=+(cy+radio*Math.sin(r1)).toFixed(4);
    const x2=+(cx+radio*Math.cos(r2)).toFixed(4),y2=+(cy+radio*Math.sin(r2)).toFixed(4);
    const large=(grados-GAP)>180?1:0;
    paths+=`<path d="M ${x1} ${y1} A ${radio} ${radio} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${item.color}" stroke-width="${grosor}" stroke-linecap="butt"/>`;
    angulo+=grados;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${radio}" fill="none" stroke="#e2e8f0" stroke-width="${grosor}"/>${paths}</svg>`;
}

// =============================================================
// ESTADO GLOBAL: periodoAgregado (según selector) + vistaDerecha
// (qué se muestra en el panel derecho — grupo, motivo, base,
// eficiencia o ficha de cuadrilla).
// =============================================================
const ORDEN_GRUPOS=["OMF","Construcciones","Soporte","Tareas Generales"];
const VALOR_ACUMULADO="__ACUMULADO__";
let periodoAgregado=null;
let vistaDerecha={tipo:'vacio'};

function parseFechaDMY(s){
  const p=s.split("/");
  return new Date(+p[2],+p[1]-1,+p[0]);
}

function rangoFechas(lista){
  let minObj=null,maxObj=null,minStr="",maxStr="";
  lista.forEach(p=>{
    const ini=parseFechaDMY(p.fecha_inicio),fin=parseFechaDMY(p.fecha_fin);
    if(!minObj||ini<minObj){minObj=ini;minStr=p.fecha_inicio;}
    if(!maxObj||fin>maxObj){maxObj=fin;maxStr=p.fecha_fin;}
  });
  return {minStr,maxStr};
}

// Suma una lista de períodos (1 o varios) en un único objeto con la
// MISMA forma que un período normal — así renderGrupo/rankings/etc.
// funcionan sin cambios, ya sea con un mes puntual o con el acumulado.
function construirPeriodoAgregado(listaPeriodos){
  const grupos={};
  ORDEN_GRUPOS.forEach(nombreGrupo=>{
    grupos[nombreGrupo]={aprobados:0,sin_aprobar:0,anulados:0,con_descuento:0,horas_descontadas:0,
      tiempo_operativo:0,tiempo_no_operativo:0,tiempo_traslados:0,tiempo_prp:0,tiempo_almuerzo:0,ot_lista:[],motivos:{},cuadrillasMap:{}};
  });

  listaPeriodos.forEach(periodo=>{
    ORDEN_GRUPOS.forEach(nombreGrupo=>{
      const gOrig=periodo.grupos[nombreGrupo];
      if(!gOrig)return;
      const gAcc=grupos[nombreGrupo];
      gAcc.aprobados+=gOrig.aprobados||0;
      gAcc.sin_aprobar+=gOrig.sin_aprobar||0;
      gAcc.anulados+=gOrig.anulados||0;
      gAcc.con_descuento+=gOrig.con_descuento||0;
      gAcc.horas_descontadas+=gOrig.horas_descontadas||0;
      // NOTA: tiempo_operativo/no_operativo/traslados/prp/almuerzo y
      // ot_lista del grupo YA NO se suman del total pre-agregado
      // (gOrig.tiempo_operativo, etc.) -- se arman mas abajo sumando
      // cuadrilla por cuadrilla, excluyendo las de servicio "SOP. N."
      // (turno nocturno normal de 12hs, distorsiona el promedio grupal
      // si se mezcla con las diurnas). Las cuadrillas SOP. N. siguen
      // apareciendo individualmente en los rankings (acc.*, mas abajo),
      // solo se excluyen de este total grupal.
      (gOrig.motivos||[]).forEach(m=>{gAcc.motivos[m.motivo]=(gAcc.motivos[m.motivo]||0)+m.hs;});
      (gOrig.cuadrillas||[]).forEach(c=>{
        if(!gAcc.cuadrillasMap[c.codigo]){
          gAcc.cuadrillasMap[c.codigo]={codigo:c.codigo,nombre:c.nombre||"",base:c.base||"",servicio:c.servicio||"",
            aprobados:0,sin_aprobar:0,anulados:0,con_descuento:0,horas_descontadas:0,
            tiempo_operativo:0,tiempo_no_operativo:0,tiempo_traslados:0,tiempo_prp:0,tiempo_almuerzo:0,ot_lista:[],motivosMap:{}};
        }
        const acc=gAcc.cuadrillasMap[c.codigo];
        if(c.nombre)acc.nombre=c.nombre;
        if(c.base)acc.base=c.base;
        if(c.servicio)acc.servicio=c.servicio;
        acc.aprobados+=c.aprobados||0;
        acc.sin_aprobar+=c.sin_aprobar||0;
        acc.anulados+=c.anulados||0;
        acc.con_descuento+=c.con_descuento||0;
        acc.horas_descontadas+=c.horas_descontadas||0;
        acc.tiempo_operativo+=c.tiempo_operativo||0;
        acc.tiempo_no_operativo+=c.tiempo_no_operativo||0;
        acc.tiempo_traslados+=c.tiempo_traslados||0;
        acc.tiempo_prp+=c.tiempo_prp||0;
        acc.tiempo_almuerzo+=c.tiempo_almuerzo||0;
        if(c.ot_lista)acc.ot_lista.push(...c.ot_lista);
        (c.motivos||[]).forEach(m=>{
          acc.motivosMap[m.motivo]=acc.motivosMap[m.motivo]||{hs:0,partes:0};
          acc.motivosMap[m.motivo].hs+=m.hs;
          acc.motivosMap[m.motivo].partes+=m.partes||0;
        });

        // Total grupal (gAcc): excluye SOP. N. -- ver nota mas arriba.
        if((c.servicio||"")!=='SOP. N.'){
          gAcc.tiempo_operativo+=c.tiempo_operativo||0;
          gAcc.tiempo_no_operativo+=c.tiempo_no_operativo||0;
          gAcc.tiempo_traslados+=c.tiempo_traslados||0;
          gAcc.tiempo_prp+=c.tiempo_prp||0;
          gAcc.tiempo_almuerzo+=c.tiempo_almuerzo||0;
          if(c.ot_lista)gAcc.ot_lista.push(...c.ot_lista);
        }
      });
    });
  });

  const gruposFinal={};
  ORDEN_GRUPOS.forEach(nombreGrupo=>{
    const gAcc=grupos[nombreGrupo];
    const motivosArr=Object.entries(gAcc.motivos).map(([motivo,hs])=>({motivo,hs})).sort((a,b)=>b.hs-a.hs);
    const cuadrillasArr=Object.values(gAcc.cuadrillasMap).map(c=>({
      codigo:c.codigo,nombre:c.nombre,base:c.base,servicio:c.servicio,
      aprobados:c.aprobados,sin_aprobar:c.sin_aprobar,anulados:c.anulados,
      con_descuento:c.con_descuento,horas_descontadas:c.horas_descontadas,
      tiempo_operativo:c.tiempo_operativo,tiempo_no_operativo:c.tiempo_no_operativo,
      tiempo_traslados:c.tiempo_traslados,tiempo_prp:c.tiempo_prp,tiempo_almuerzo:c.tiempo_almuerzo,
      ot_lista:c.ot_lista,
      motivos:Object.entries(c.motivosMap).map(([motivo,v])=>({motivo,hs:v.hs,partes:v.partes})).sort((a,b)=>b.hs-a.hs)
    })).sort((a,b)=>b.horas_descontadas-a.horas_descontadas);

    gruposFinal[nombreGrupo]={
      aprobados:gAcc.aprobados,sin_aprobar:gAcc.sin_aprobar,anulados:gAcc.anulados,
      con_descuento:gAcc.con_descuento,horas_descontadas:gAcc.horas_descontadas,
      tiempo_operativo:gAcc.tiempo_operativo,tiempo_no_operativo:gAcc.tiempo_no_operativo,
      tiempo_traslados:gAcc.tiempo_traslados,tiempo_prp:gAcc.tiempo_prp,tiempo_almuerzo:gAcc.tiempo_almuerzo,
      ot_lista:gAcc.ot_lista,
      motivos:motivosArr,cuadrillas:cuadrillasArr
    };
  });
  return {grupos:gruposFinal};
}

function cambiarPeriodo(valor){

  {id:'operativo',label:'% Tiempo Operativo'},
  {id:'traslados',label:'% Tiempos de Traslado'},

];

// Arma {filas, titulo, opciones} para el ranking de cuadrillas del grupo
// según la pestaña elegida. Todas las filas ya incluyen servicio/base para
// las 3 primeras columnas comunes de generarBarrasHorizontales.
function construirFilasRanking(tipoRanking,datosGrupo){
  let filas=[],titulo="",opciones={};

  if(tipoRanking==='eficiencia'){
    titulo="Ranking de Eficiencia";
    datosGrupo.cuadrillas.forEach(c=>{
      const total=(c.aprobados||0)+(c.sin_aprobar||0)+(c.anulados||0);
      if(total<=0)return;
      const indice=100-(c.con_descuento||0)/total*100;
      filas.push({cuadrilla:c.codigo,nombre:c.nombre||c.codigo,servicio:c.servicio,base:c.base,
        valor:indice,extra:`${total-(c.con_descuento||0)}/${total}`});
    });
    filas.sort((a,b)=>a.valor-b.valor);
    opciones={colValorLabel:"Índice",colExtraLabel:"Partes OK",formatoValor:v=>v.toFixed(1)+"%",colorFn:colorEficiencia};
  }else if(tipoRanking==='operativo'){
    titulo="Ranking de % Tiempo Operativo";
    datosGrupo.cuadrillas.forEach(c=>{
      const tot=(c.tiempo_operativo||0)+(c.tiempo_no_operativo||0);
      if(tot<=0)return;
      const pct=(c.tiempo_operativo||0)/tot*100;
      filas.push({cuadrilla:c.codigo,nombre:c.nombre||c.codigo,servicio:c.servicio,base:c.base,
        valor:pct,extra:(c.tiempo_operativo||0).toFixed(2)+"h"});
    });
    filas.sort((a,b)=>a.valor-b.valor);
    opciones={colValorLabel:"% Operativo",colExtraLabel:"Hs Operativas",formatoValor:v=>v.toFixed(1)+"%"};
  }else if(tipoRanking==='traslados'){
    titulo="Ranking de % Tiempos de Traslado";
    datosGrupo.cuadrillas.forEach(c=>{
      const tot=(c.tiempo_operativo||0)+(c.tiempo_no_operativo||0);
      if(tot<=0)return;
      const pct=(c.tiempo_traslados||0)/tot*100;
      if(pct<=0)return;
      filas.push({cuadrilla:c.codigo,nombre:c.nombre||c.codigo,servicio:c.servicio,base:c.base,
        valor:pct,extra:(c.tiempo_traslados||0).toFixed(2)+"h"});
    });
    filas.sort((a,b)=>b.valor-a.valor);
    opciones={colValorLabel:"% Traslado",colExtraLabel:"Hs Traslado",formatoValor:v=>v.toFixed(1)+"%"};
  }else if(tipoRanking==='prp'){
    titulo="Ranking de % Tiempos de PRP";
    datosGrupo.cuadrillas.forEach(c=>{
      const tot=(c.tiempo_operativo||0)+(c.tiempo_no_operativo||0);
      if(tot<=0)return;
      const pct=(c.tiempo_prp||0)/tot*100;
      if(pct<=0)return;
      filas.push({cuadrilla:c.codigo,nombre:c.nombre||c.codigo,servicio:c.servicio,base:c.base,
        valor:pct,extra:(c.tiempo_prp||0).toFixed(2)+"h"});
    });
    filas.sort((a,b)=>b.valor-a.valor);
    opciones={colValorLabel:"% PRP",colExtraLabel:"Hs PRP",formatoValor:v=>v.toFixed(1)+"%"};
  }else if(tipoRanking==='ot'){
    titulo="Ranking de Promedio de OT x Día";
    datosGrupo.cuadrillas.forEach(c=>{
      const lista=c.ot_lista||[];
      if(!lista.length)return;
      filas.push({cuadrilla:c.codigo,nombre:c.nombre||c.codigo,servicio:c.servicio,base:c.base,
        valor:calcularMedia(lista),extra:lista.length});
    });
    filas.sort((a,b)=>b.valor-a.valor);
    opciones={colValorLabel:"Prom. OT/Día",colExtraLabel:"Partes",formatoValor:v=>v.toFixed(2)};
  }else{ // 'hs' (default)
    titulo="Ranking de Hs Descontadas";
    datosGrupo.cuadrillas.forEach(c=>{
      if(c.horas_descontadas>0)filas.push({cuadrilla:c.codigo,nombre:c.nombre||c.codigo,servicio:c.servicio,base:c.base,
        valor:c.horas_descontadas,extra:c.con_descuento});
    });
    filas.sort((a,b)=>b.valor-a.valor);
    opciones={colValorLabel:"Horas",colExtraLabel:"Cant. Desvíos",formatoValor:v=>v.toFixed(2)+"h"};
  }

  return {filas,titulo,opciones};
}

function cambiarRankingGrupo(id){

function renderRankingGrupoMotivo(){
  const datosGrupo=periodoAgregado.grupos[vistaDerecha.grupo];
  if(!datosGrupo)return;

  const pills=ORDEN_GRUPOS.map(g=>{
    const activo=g===vistaDerecha.grupo?"pill-activo":"";
    return `<div class="pill ${activo}" onclick="abrirDrilldownGrupo('${g}')">${g}</div>`;
  }).join("");

  // tipo==='motivo': ranking fijo de Hs Descontadas para ese motivo puntual (sin pestañas)
  if(vistaDerecha.tipo==='motivo'){
    const m=(datosGrupo.motivos||[]).find(x=>x.motivo===vistaDerecha.motivo);
    const totGrupo=datosGrupo.horas_descontadas||0;
    const pct=(m&&totGrupo>0)?(m.hs/totGrupo*100).toFixed(1):0;
    const seccionSuperior=`<div class="ref-card">
      <div class="grupo-nombre">${vistaDerecha.grupo}</div>
      <div class="motivo-destacado">${vistaDerecha.motivo}</div>
      <div class="motivo-hs">${m?m.hs.toFixed(2):"0.00"} hs</div>
      <div class="motivo-pct">${pct}% del total de descuentos de ${vistaDerecha.grupo}</div>
    </div>`;
    let filas=[];
    datosGrupo.cuadrillas.forEach(c=>{
      const cm=(c.motivos||[]).find(x=>x.motivo===vistaDerecha.motivo);
      if(cm&&cm.hs>0)filas.push({cuadrilla:c.codigo,nombre:c.nombre||c.codigo,servicio:c.servicio,base:c.base,valor:cm.hs,extra:cm.partes});
    });
    filas.sort((a,b)=>b.valor-a.valor);
    const opciones={colValorLabel:"Horas",colExtraLabel:"Cant. Desvíos",formatoValor:v=>v.toFixed(2)+"h"};

    document.getElementById("panel-der").innerHTML=`<div class="pills-bar">${pills}</div>
      <button class="btn-volver" onclick="cerrarPanelDerecho()">← Limpiar selección</button>
      ${seccionSuperior}
      <div class="ranking-titulo">Ranking de Hs Descontadas — ${vistaDerecha.motivo}</div>
      ${filas.length?generarBarrasHorizontales(filas,opciones):'<p class="no-descuentos">Sin datos para este filtro</p>'}`;
    return;
  }

  // tipo==='grupo': gráficos completos + ranking con pestañas (6 métricas)
  const seccionSuperior=generarGraficosGrupo(vistaDerecha.grupo,datosGrupo);
  const rankingActivo=vistaDerecha.ranking||'hs';
  const {filas,titulo,opciones}=construirFilasRanking(rankingActivo,datosGrupo);

  const tabsHtml=RANKINGS_GRUPO.map(r=>{
    const activo=r.id===rankingActivo?"tab-ranking-activo":"";
    return `<div class="tab-ranking ${activo}" onclick="cambiarRankingGrupo('${r.id}')">${r.label}</div>`;
  }).join("");

  document.getElementById("panel-der").innerHTML=`<div class="pills-bar">${pills}</div>
    <button class="btn-volver" onclick="cerrarPanelDerecho()">← Limpiar selección</button>
    ${seccionSuperior}
    <div class="ranking-header-tabs">
      <div class="ranking-titulo-sin-borde">${titulo}</div>
      <div class="tabs-ranking-bar">${tabsHtml}</div>
    </div>
    ${filas.length?generarBarrasHorizontales(filas,opciones):'<p class="no-descuentos">Sin datos para este ranking</p>'}`;
}

// Arma los 3 gráficos del grupo (Motivos, % Tiempo Operativo, Operativo vs
// Traslados vs PRP) con espacio real — se muestran acá, en el panel
// derecho (70% de pantalla), en vez de comprimidos en la tarjeta angosta.
function generarGraficosGrupo(nombre,datosGrupo){
  const motivos=datosGrupo.motivos||[];
  let motivoChart;
  if(motivos.length){
    const svg=generarDonut(motivos,nombre,130),tot=motivos.reduce((s,m)=>s+m.hs,0);
    const leyenda=motivos.map((item,i)=>{
      const color=PALETA[i%PALETA.length],pct=tot>0?(item.hs/tot*100).toFixed(1):0;
      const motivoAttr=item.motivo.replace(/'/g,"\\'");
      return `<div class="leyenda-item" onclick="abrirDrilldownMotivo('${nombre}','${motivoAttr}')"><div class="leyenda-dot" style="background:${color}"></div><span class="leyenda-nombre" title="${item.motivo}">${item.motivo}</span><span class="leyenda-hs">${item.hs.toFixed(2)}h · ${pct}%</span></div>`;
    }).join("");
    motivoChart=`<div class="grafico-box"><div class="chart-title">Motivo de Descuentos (click para detalle)</div>
      <div class="chart-container"><div class="donut-wrap">${svg}<div class="donut-center"><div class="donut-center-val">${tot.toFixed(1)}h</div><div class="donut-center-label">total</div></div></div><div class="leyenda">${leyenda}</div></div></div>`;
  }else{
    motivoChart=`<div class="grafico-box"><div class="chart-title">Motivo de Descuentos</div><p class="no-descuentos">Sin motivos de descuento registrados</p></div>`;
  }

  const top=datosGrupo.tiempo_operativo||0, tnop=datosGrupo.tiempo_no_operativo||0, totOp=top+tnop;
  let opChart="";
  if(totOp>0){
    const pctOp=top/totOp*100, pctNoOp=100-pctOp;
    opChart=`<div class="grafico-box"><div class="chart-title">% Tiempo Operativo</div>
      <div class="chart-container"><div class="donut-wrap">${generarDonutOperativo(pctOp,130)}<div class="donut-center"><div class="donut-center-val">${pctOp.toFixed(1)}%</div><div class="donut-center-label">operativo</div></div></div>
      <div class="leyenda">
        <div class="leyenda-item"><div class="leyenda-dot" style="background:#15803d"></div><span class="leyenda-nombre">Operativo</span><span class="leyenda-hs">${top.toFixed(2)}h · ${pctOp.toFixed(1)}%</span></div>
        <div class="leyenda-item"><div class="leyenda-dot" style="background:#ef4444"></div><span class="leyenda-nombre">No Operativo</span><span class="leyenda-hs">${tnop.toFixed(2)}h · ${pctNoOp.toFixed(1)}%</span></div>
      </div></div></div>`;
  }

  const traslados=datosGrupo.tiempo_traslados||0, prp=datosGrupo.tiempo_prp||0, almuerzo=datosGrupo.tiempo_almuerzo||0;
  const totalHoras=totOp; // op + no_op — el total representativo para los %
  let compChart="";
  if(top+traslados+prp+almuerzo>0){
    const itemsComp=[
      {label:"Operativo",color:"#15803d",valor:top},
      {label:"Traslados",color:"#2563eb",valor:traslados},
      {label:"PRP",color:"#f59e0b",valor:prp},
      {label:"Almuerzo",color:"#a855f7",valor:almuerzo}
    ];
    const svgComp=generarDonutGenerico(itemsComp,130);
    const leyendaComp=itemsComp.map(item=>{
      // El % se calcula sobre el total de horas (operativo + no operativo),
      // no sobre la suma de las categorías de esta torta — por eso pueden
      // no sumar 100% entre ellas: cada % es el peso real sobre el total.
      const pct=totalHoras>0?(item.valor/totalHoras*100).toFixed(1):"0.0";
      return `<div class="leyenda-item"><div class="leyenda-dot" style="background:${item.color}"></div><span class="leyenda-nombre">${item.label}</span><span class="leyenda-hs">${item.valor.toFixed(2)}h · ${pct}%</span></div>`;
    }).join("");
    compChart=`<div class="grafico-box"><div class="chart-title">Operativo vs Traslados vs PRP vs Almuerzo</div>
      <div class="chart-container"><div class="donut-wrap">${svgComp}</div><div class="leyenda">${leyendaComp}</div></div></div>`;
  }

  return `<div class="graficos-grupo">${motivoChart}${opChart}${compChart}</div>`;
}

// Limpieza de nombre de servicio: saca guión/espacio inicial ("– 1113-PETROSAR")
// y el sufijo "-PETROSAR" / " PETROSAR" al final, para que quede solo "1113".
function limpiarNombre(nombre){
  if(!nombre)return nombre;
  return nombre
    .replace(/^[\s\-–—]+/, "")
    .replace(/[\s\-–—]*PETROSAR\s*$/i, "")
    .trim() || nombre;
}

function generarBarrasHorizontales(filas, opciones){
  opciones = opciones || {};
  const colValorLabel = opciones.colValorLabel || "Horas";
  const colExtraLabel = opciones.colExtraLabel || "Cant. Desvíos";
  const formatoValor = opciones.formatoValor || (v=>v.toFixed(2)+"h");
  const colorFn = opciones.colorFn || null;

  const maxVal=Math.max(...filas.map(f=>Math.abs(f.valor)),0.0001);
  let html=`<div class="barras-header" style="grid-template-columns:22px 90px 90px 56px 1fr 76px 92px;">
    <div></div><div>Tablet</div><div>Servicio</div><div>Base</div><div></div><div class="col-right">${colValorLabel}</div><div class="col-right">${colExtraLabel}</div>
  </div><div class="barras-chart">`;
  filas.forEach((f,i)=>{
    const pct=(Math.abs(f.valor)/maxVal*100).toFixed(1);
    const nombreLimpio=limpiarNombre(f.nombre);
    const colorEstilo=colorFn?`background:${colorFn(f.valor)};`:"";
    html+=`<div class="barra-row" style="grid-template-columns:22px 90px 90px 56px 1fr 76px 92px;">
      <div class="barra-rank">${i+1}</div>
      <div class="barra-label" title="${nombreLimpio} (${f.cuadrilla})">${nombreLimpio}</div>
      <div class="barra-base">${f.servicio||"-"}</div>
      <div class="barra-base">${f.base||"-"}</div>
      <div class="barra-track"><div class="barra-fill" style="${colorEstilo}width:${pct}%"></div></div>
      <div class="barra-valor">${formatoValor(f.valor)}</div>
      <div class="barra-partes">${f.extra}</div>
    </div>`;
  });
  html+=`</div>`;
  return html;
}

// =============================================================
// ACUMULADO POR BASE: agrupa por base física (CD/RE/VH/AG/TP) el
// periodoAgregado actual (ya sea 1 mes o el histórico completo).
// Cada fila es clickeable → drill-down a las cuadrillas de esa base.
// =============================================================
function agregarPorBase(periodo){
  const BASES=["CD","RE","VH","AG","TP"];
  const tot={};
  BASES.forEach(b=>tot[b]={hs:0,partes:0,total:0,top:0,tnop:0});
  ORDEN_GRUPOS.forEach(nombreGrupo=>{
    const g=periodo.grupos[nombreGrupo];
    if(!g)return;
    (g.cuadrillas||[]).forEach(c=>{
      const b=c.base;
      if(!b||!tot[b])return;
      tot[b].hs+=c.horas_descontadas||0;
      tot[b].partes+=c.con_descuento||0;
      tot[b].total+=(c.aprobados||0)+(c.sin_aprobar||0)+(c.anulados||0);
      // % Operativo de la base: excluye SOP. N. (ver misma nota en
      // construirPeriodoAgregado) -- el resto de los totales de esta
      // base (hs descontadas, partes, eficiencia) SI las incluye.
      if((c.servicio||"")!=='SOP. N.'){
        tot[b].top+=c.tiempo_operativo||0;
        tot[b].tnop+=c.tiempo_no_operativo||0;
      }
    });
  });
  return BASES.map(b=>({base:b,hs:tot[b].hs,partes:tot[b].partes,total:tot[b].total,
                         tiempoOperativo:tot[b].top,tiempoNoOperativo:tot[b].tnop})).sort((a,b)=>b.hs-a.hs);
}

function abrirAcumuladoBase(){
  vistaDerecha={tipo:'base'};

}

function renderAcumuladoBaseEnPanel(){
  const filas=agregarPorBase(periodoAgregado);
  let html=`<button class="btn-volver" onclick="cerrarPanelDerecho()">← Limpiar selección</button>
    <div class="ranking-titulo">Total por Base — click en una base para ver sus cuadrillas</div>`;
  html+=filas.some(f=>f.hs>0||f.tiempoOperativo>0||f.tiempoNoOperativo>0)?generarBarrasBaseConEficiencia(filas):`<p class="no-descuentos">Sin datos</p>`;
  document.getElementById("panel-der").innerHTML=html;
}

function generarBarrasBaseConEficiencia(filas){
  const maxVal=Math.max(...filas.map(f=>f.hs),0.0001);
  let html=`<div class="barras-header" style="grid-template-columns:22px 60px 1fr 62px 78px 62px 62px;">
    <div></div><div>Base</div><div></div><div class="col-right">Horas</div><div class="col-right">Desvíos</div><div class="col-right">Efic.</div><div class="col-right">% Op.</div>
  </div><div class="barras-chart">`;
  filas.forEach((f,i)=>{
    const pct=(f.hs/maxVal*100).toFixed(1);
    const eficiencia=f.total>0?(f.partes/f.total*100):0;
    const totTiempo=f.tiempoOperativo+f.tiempoNoOperativo;
    const pctOp=totTiempo>0?(f.tiempoOperativo/totTiempo*100):null;
    html+=`<div class="barra-row" style="grid-template-columns:22px 60px 1fr 62px 78px 62px 62px;cursor:pointer;" onclick="abrirBaseDetalle('${f.base}')">
      <div class="barra-rank">${i+1}</div>
      <div class="barra-label">${f.base}</div>
      <div class="barra-track"><div class="barra-fill" style="width:${pct}%"></div></div>
      <div class="barra-valor">${f.hs.toFixed(2)}h</div>
      <div class="barra-partes">${f.partes}</div>
      <div class="barra-partes">${eficiencia.toFixed(1)}%</div>
      <div class="barra-partes">${pctOp!==null?pctOp.toFixed(1)+"%":"-"}</div>
    </div>`;
  });
  html+=`</div>`;
  return html;
}

function abrirBaseDetalle(base){
  vistaDerecha={tipo:'base_detalle',base:base};
  renderPanelDerecho();
}

function volverAAcumuladoBase(){
  vistaDerecha={tipo:'base'};
  renderPanelDerecho();
}

function renderBaseDetalleEnPanel(base){
  const filas=[];
  ORDEN_GRUPOS.forEach(nombreGrupo=>{
    const g=periodoAgregado.grupos[nombreGrupo];
    if(!g)return;
    (g.cuadrillas||[]).forEach(c=>{
      if(c.base===base&&c.horas_descontadas>0){
        filas.push({cuadrilla:c.codigo,nombre:c.nombre||c.codigo,servicio:c.servicio,base:c.base,valor:c.horas_descontadas,extra:c.con_descuento});
      }
    });
  });
  filas.sort((a,b)=>b.valor-a.valor);

  const opciones={colValorLabel:"Horas",colExtraLabel:"Cant. Desvíos",formatoValor:v=>v.toFixed(2)+"h"};
  let html=`<button class="btn-volver" onclick="volverAAcumuladoBase()">← Volver a Total por Base</button>
    <div class="ranking-titulo">Cuadrillas de la Base ${base} — Ranking de Hs Descontadas</div>`;
  html+=filas.length?generarBarrasHorizontales(filas,opciones):`<p class="no-descuentos">Sin descuentos registrados en esta base</p>`;
  document.getElementById("panel-der").innerHTML=html;
}

// =============================================================
// VISTA DE EFICIENCIA: índice = % de partes SIN descuento sobre el
// total de partes de la cuadrilla, en el alcance actual (mes o
// acumulado). Ordenado de PEOR a MEJOR — las prioritarias arriba.
// =============================================================
function colorEficiencia(v){
  if(v>=95)return "linear-gradient(90deg,#15803d,#22c55e)";
  if(v>=85)return "linear-gradient(90deg,#b45309,#f59e0b)";
  return "linear-gradient(90deg,#b91c1c,#ef4444)";
}

// =============================================================
// BUSCADOR DE CUADRILLA: encuentra por código o por nombre limpio
// (tablet) en cualquier período/grupo, y abre su ficha con el
// historial completo (todos los períodos — independiente del
// selector de período/acumulado, porque una ficha es de por vida).
// =============================================================
function buscarCuadrilla(){
  const input=document.getElementById("buscador-cuadrilla");
  const query=input.value.trim();
  if(!query)return;
  const queryLower=query.toLowerCase();

  let encontrado=null;
  busqueda:
  for(const periodo of DATA.periodos){
    for(const nombreGrupo of ORDEN_GRUPOS){
      const g=periodo.grupos[nombreGrupo];
      if(!g)continue;
      for(const c of (g.cuadrillas||[])){
        const nombreLimpio=limpiarNombre(c.nombre||"").toLowerCase();
        if(c.codigo.toLowerCase()===queryLower||nombreLimpio===queryLower||(nombreLimpio&&nombreLimpio.includes(queryLower))){
          encontrado={codigo:c.codigo,grupo:nombreGrupo};
          break busqueda;
        }
      }
    }
  }

  if(!encontrado){
    alert("No se encontró ninguna cuadrilla con ese código o tablet: "+query);
    return;
  }
  abrirFichaCuadrilla(encontrado.codigo,encontrado.grupo);
}

function abrirFichaCuadrilla(codigo,grupo){
  vistaDerecha={tipo:'ficha'};

  let nombreLimpio=codigo;
  const basesVistas=new Set();
  const filasPeriodo=[];

  DATA.periodos.forEach(periodo=>{
    const g=periodo.grupos[grupo];
    if(!g)return;
    const c=(g.cuadrillas||[]).find(x=>x.codigo===codigo);
    if(!c)return;
    const total=(c.aprobados||0)+(c.sin_aprobar||0)+(c.anulados||0);
    if(total<=0&&(c.horas_descontadas||0)<=0)return;
    if(c.nombre)nombreLimpio=limpiarNombre(c.nombre);
    if(c.base)basesVistas.add(c.base);
    filasPeriodo.push({
      label:periodo.label,
      aprobados:c.aprobados||0,sinAprobar:c.sin_aprobar||0,anulados:c.anulados||0,
      total,conDescuento:c.con_descuento||0,hs:c.horas_descontadas||0,
      tiempoOperativo:c.tiempo_operativo||0,tiempoNoOperativo:c.tiempo_no_operativo||0,
      otLista:c.ot_lista||[],
      motivos:c.motivos||[]
    });
  });

  let html=`<button class="btn-volver" onclick="cerrarPanelDerecho()">← Limpiar selección</button>
    <div class="ficha-nombre">${nombreLimpio}</div>
    <div class="ficha-meta">Código: ${codigo} · Grupo: ${grupo} · Base: ${[...basesVistas].join(", ")||"-"}</div>`;

  if(!filasPeriodo.length){
    html+=`<p class="no-descuentos">Sin actividad registrada en los períodos disponibles.</p>`;
  }else{
    html+=`<div style="overflow-x:auto;"><table class="ranking-tabla"><thead><tr>
      <th>Período</th><th>Aprob.</th><th>Sin Aprob.</th><th>Anul.</th><th>Total Partes</th><th>Partes c/Desc.</th><th>Hs Desc.</th><th>T. Operativo</th><th>T. No Operativo</th><th>% Operativo</th><th>Prom. OT/Día</th><th>Mediana OT/Día</th>
    </tr></thead><tbody>`;
    filasPeriodo.forEach(f=>{
      const totTiempo=f.tiempoOperativo+f.tiempoNoOperativo;
      const pctOpFila=totTiempo>0?(f.tiempoOperativo/totTiempo*100):null;
      html+=`<tr><td>${f.label}</td><td>${f.aprobados}</td><td>${f.sinAprobar}</td><td>${f.anulados}</td>
        <td>${f.total}</td><td>${f.conDescuento}</td><td>${f.hs.toFixed(2)}</td>
        <td>${f.tiempoOperativo.toFixed(2)}</td><td>${f.tiempoNoOperativo.toFixed(2)}</td>
        <td>${pctOpFila!==null?pctOpFila.toFixed(1)+"%":"-"}</td>
        <td>${f.otLista.length?calcularMedia(f.otLista).toFixed(2):"-"}</td>
        <td>${f.otLista.length?calcularMediana(f.otLista).toFixed(2):"-"}</td></tr>`;
    });
    html+=`</tbody></table></div>`;

    const motivosTotal={};
    filasPeriodo.forEach(f=>(f.motivos||[]).forEach(m=>{
      motivosTotal[m.motivo]=(motivosTotal[m.motivo]||0)+m.hs;
    }));
    const motivosArr=Object.entries(motivosTotal).map(([motivo,hs])=>({motivo,hs})).sort((a,b)=>b.hs-a.hs);

    if(motivosArr.length){
      const totalHs=motivosArr.reduce((s,m)=>s+m.hs,0);
      const maxM=Math.max(...motivosArr.map(m=>m.hs),0.0001);
      html+=`<div class="ranking-titulo" style="margin-top:26px;">Motivos de Descuento — Histórico (${totalHs.toFixed(2)}h)</div><div class="barras-chart">`;
      motivosArr.forEach(m=>{
        const pct=(m.hs/maxM*100).toFixed(1);
        html+=`<div class="barra-row" style="grid-template-columns:150px 1fr 70px;">
          <div class="barra-label">${m.motivo}</div>
          <div class="barra-track"><div class="barra-fill" style="width:${pct}%"></div></div>
          <div class="barra-valor">${m.hs.toFixed(2)}h</div>
        </div>`;
      });
      html+=`</div>`;
    }

    // % Tiempo Operativo — acumulado de todos los períodos mostrados
    const totalOp=filasPeriodo.reduce((s,f)=>s+f.tiempoOperativo,0);
    const totalNoOp=filasPeriodo.reduce((s,f)=>s+f.tiempoNoOperativo,0);
    const totalTiempo=totalOp+totalNoOp;
    if(totalTiempo>0){
      const pctOp=totalOp/totalTiempo*100;
      const pctNoOp=100-pctOp;
      html+=`<div class="ranking-titulo" style="margin-top:26px;">% Tiempo Operativo — Acumulado</div>
        <div class="chart-container">
          <div class="donut-wrap">${generarDonutOperativo(pctOp)}<div class="donut-center"><div class="donut-center-val">${pctOp.toFixed(1)}%</div><div class="donut-center-label">operativo</div></div></div>
          <div class="leyenda">
            <div class="leyenda-item"><div class="leyenda-dot" style="background:#15803d"></div><span class="leyenda-nombre">Tiempo Operativo</span><span class="leyenda-hs">${totalOp.toFixed(2)}h · ${pctOp.toFixed(1)}%</span></div>
            <div class="leyenda-item"><div class="leyenda-dot" style="background:#ef4444"></div><span class="leyenda-nombre">Tiempo No Operativo</span><span class="leyenda-hs">${totalNoOp.toFixed(2)}h · ${pctNoOp.toFixed(1)}%</span></div>
          </div>
        </div>`;
    }

    // Promedio y Mediana de OT x Día — acumulado (concatena las listas de
    // todos los períodos mostrados, para que la mediana sea la real y no
    // un promedio de medianas).
    const otListaTotal=filasPeriodo.reduce((acc,f)=>acc.concat(f.otLista||[]),[]);
    if(otListaTotal.length){
      html+=`<div class="ranking-titulo" style="margin-top:26px;">Promedio / Mediana de OT x Día — Acumulado</div>
        <div class="mini-metricas">
          <div>Promedio<br><b>${calcularMedia(otListaTotal).toFixed(2)}</b></div>
          <div>Mediana<br><b>${calcularMediana(otListaTotal).toFixed(2)}</b></div>
          <div>Partes considerados<br><b>${otListaTotal.length}</b></div>
        </div>`;
    }
  }
  document.getElementById("panel-der").innerHTML=html;
}

// Donut simple de 2 categorías fijas (Operativo/No Operativo), sin
// interacción — usado en la ficha de cuadrilla.
function generarDonutOperativo(pctOp,size=140){
  const cx=size/2,cy=size/2,grosor=Math.max(size*0.18,16),radio=cx-grosor/2-3;
  const grados=Math.max(0,Math.min(100,pctOp))/100*360;
  let path="";
  if(grados>0){
    const r1=-90*Math.PI/180,r2=(-90+grados)*Math.PI/180;
    const x1=+(cx+radio*Math.cos(r1)).toFixed(4),y1=+(cy+radio*Math.sin(r1)).toFixed(4);
    const x2=+(cx+radio*Math.cos(r2)).toFixed(4),y2=+(cy+radio*Math.sin(r2)).toFixed(4);
    const large=grados>180?1:0;
    path=`<path d="M ${x1} ${y1} A ${radio} ${radio} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="#15803d" stroke-width="${grosor}" stroke-linecap="butt"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${radio}" fill="none" stroke="#ef4444" stroke-width="${grosor}"/>${path}</svg>`;
}
