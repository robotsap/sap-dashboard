<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Gerencia — Operaciones</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f0f2f5;--surface:#ffffff;--border:#e2e8f0;--card-bg:#ffffff;--accent:#FFD700;--orange:#f97316;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--topbar:#0f172a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:0 0 48px;}
  .topbar{background:var(--topbar);border-bottom:3px solid var(--accent);padding:12px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15);}
  .topbar-titulo{display:flex;align-items:center;gap:12px;}
  .topbar-logo{width:38px;height:38px;border-radius:8px;object-fit:cover;}
  .topbar-titulo-texto{display:flex;flex-direction:column;gap:2px;}
  .topbar-nombre{font-size:17px;font-weight:800;color:#ffffff;}
  .topbar-nombre-acento{color:var(--accent);}
  .topbar-actualizado{font-size:11px;color:#94a3b8;}
  .topbar-periodo{display:flex;align-items:center;gap:10px;}
  .grupo-tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .grupo-tab{padding:8px 20px;border-radius:8px;font-size:14px;font-weight:700;background:#1e293b;color:#cbd5e1;border:1px solid #334155;cursor:pointer;}
  .grupo-tab-activo{background:var(--accent);color:#0f172a;border-color:var(--accent);cursor:default;}
  .grupo-tab-placeholder{color:#64748b;cursor:not-allowed;}
  .periodo-label{color:#cbd5e1;font-size:13px;font-weight:600;}
  .select-wrap{position:relative;}
  select{appearance:none;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:7px 32px 7px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#ffffff;cursor:pointer;outline:none;}
  select:hover,select:focus{border-color:var(--accent);}
  .select-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--accent);font-size:10px;}
  .main-content{padding:24px 32px;}
  .subgrupo-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .subgrupo-tab{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:700;color:var(--text2);background:var(--card-bg);border:1px solid var(--border);cursor:pointer;}
  .subgrupo-tab-activo{background:var(--orange);color:#ffffff;border-color:var(--orange);cursor:default;}
  .app-split-ger{display:flex;gap:20px;align-items:flex-start;}
  .panel-izq-ger{flex:0 0 30%;min-width:280px;position:sticky;top:90px;}
  .panel-der-ger{flex:1;min-width:0;background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);min-height:200px;}
  @media(max-width:1000px){.app-split-ger{flex-direction:column;}.panel-izq-ger{flex:1 1 auto;position:static;width:100%;min-width:0;}.main-content{padding:16px;}.topbar{padding:12px 16px;flex-wrap:wrap;}}
  .grupo-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);}
  .card-soporte{border-top:4px solid var(--orange);}
  .grupo-header{padding:16px 22px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:#fafbfc;}
  .grupo-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--orange);}
  .grupo-nombre{font-size:15px;font-weight:700;color:var(--text);}
  .fila-metrica{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;background:#fffbe8;border-top:1px solid var(--border);}
  .fila-metrica:first-of-type{border-top:none;}
  .fila-metrica label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text2);cursor:pointer;}
  .fila-metrica input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
  .fila-metrica .valor{font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:#b45309;}
  .tarjeta-seccion-header{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 22px 8px;background:#fafbfc;border-top:1px solid var(--border);}
  .tarjeta-seccion-header .titulo-seccion{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;}
  .tarjeta-seccion-header .col-header{text-align:right;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .tarjeta-seccion-header .col-header .th-sub{text-transform:none;font-weight:400;margin-top:1px;}
  .fila-total{background:#f1f5f9;border-top:2px solid var(--border);}
  .fila-total label{font-weight:700;color:var(--text);cursor:default;}
  .fila-total .valor{color:var(--text);}
  .tarjeta-ot-bubble{margin-top:16px;}
  .panel-placeholder{color:var(--muted);font-size:14px;padding:20px 4px;}
  .tabla-rapida-box{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:24px;}
  .tabla-rapida{width:100%;border-collapse:collapse;font-size:13px;}
  .tabla-rapida th{background:#f8fafc;color:var(--muted);font-size:11px;letter-spacing:.3px;text-align:center;padding:9px 12px;border-bottom:1px solid var(--border);font-weight:600;}
  .tabla-rapida th:nth-child(1),.tabla-rapida th:nth-child(2),.tabla-rapida th:nth-child(3){text-align:left;}
  .th-sub{font-weight:400;color:var(--muted);font-size:10px;margin-top:2px;text-transform:none;letter-spacing:0;}
  .tabla-rapida th .th-sub{font-weight:400;color:var(--muted);font-size:10px;margin-top:2px;text-transform:none;letter-spacing:0;}
  .tabla-rapida td{padding:8px 12px;border-top:1px solid var(--border);text-align:center;font-family:'DM Mono',monospace;font-weight:600;color:var(--text);}
  .tabla-rapida td:nth-child(1),.tabla-rapida td:nth-child(2),.tabla-rapida td:nth-child(3){text-align:left;font-family:'Inter',sans-serif;font-weight:500;color:var(--text2);}
  .tabla-rapida tr:first-child td{border-top:none;}
  .tabla-rapida tr:nth-child(even){background:#fafbfc;}
  .panel-titulo{font-size:13px;color:#1e3a8a;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
  .panel-ranking{margin-bottom:28px;}
  .ranking-box{border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .ranking-header,.ranking-row{display:grid;grid-template-columns:26px 90px 90px 56px 1fr 88px;padding:9px 14px;font-size:13px;align-items:center;column-gap:8px;}
  .ranking-header{color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border);}
  .ranking-row{border-top:1px solid var(--border);cursor:pointer;}
  .ranking-row:first-of-type{border-top:none;}
  .ranking-row:hover{background:#f8fafc;}
  .ranking-row-activa{background:#eff6ff;}
  .ranking-row .num{color:var(--muted);}
  .ranking-bar-track{background:#f1f5f9;border-radius:4px;height:14px;overflow:hidden;}
  .ranking-bar-fill{height:100%;background:#3b82f6;border-radius:4px;}
  .ranking-row .valor{text-align:center;font-weight:700;font-family:'DM Mono',monospace;}
  .trend-inline{border-top:1px solid var(--border);background:#f8fafc;padding:16px 18px 12px;}
  .trend-inline-titulo{font-size:11px;color:var(--text2);font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:.3px;}
  .trend-vert-wrap{display:flex;align-items:flex-end;gap:14px;height:160px;padding:0 4px;}
  .trend-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .trend-bar-valor{font-size:11px;font-weight:700;font-family:'DM Mono',monospace;color:var(--text2);margin-bottom:6px;}
  .trend-bar{width:100%;max-width:34px;background:#3b82f6;border-radius:5px 5px 0 0;min-height:2px;}
  .trend-bar-label{font-size:11px;color:var(--muted);margin-top:8px;white-space:nowrap;}
</style>
</head>

// Dashboard Gerencia trabaja SOLO con valores mensuales (sin acumulado
// anual) -- periodoActual siempre es el "nombre" de un periodo real de
// DATA.periodos (ej. "Junio_26").
let periodoActual=null;
let metricaAbierta=null;
let grupoActivo="Soporte";       // que tab de arriba (franja negra) esta seleccionado
let subgrupoActivo="diurno";     // que sub-tab (Soldadores, Soporte Nocturno, etc.) esta seleccionado

// Devuelve el "label" legible de un periodo (ej. "Junio 26") a partir de
// su "nombre" (ej. "Junio_26"), buscandolo en DATA.periodos.
// Tabs de grupo (OMF, Soporte, Construcciones, Tareas Grales, Mecánica).
// Soporte y Construcciones ya tienen datos reales -- el resto son
// placeholders visuales, listos para cuando se sume la info de cada uno.
function seleccionarGrupoTab(nombreGrupo){
  if(!SUBGRUPOS_POR_GRUPO[nombreGrupo]){
    console.log(`Grupo "${nombreGrupo}" todavía no tiene datos cargados.`);
    return;
  }
  if(grupoActivo===nombreGrupo)return;
  grupoActivo=nombreGrupo;
  document.querySelectorAll(".grupo-tab").forEach(el=>{
    el.classList.toggle("grupo-tab-activo", el.textContent.trim()===nombreGrupo);
  });
  subgrupoActivo=subgruposDe(grupoActivo)[0].key;
  metricaAbierta=null;
  cuadrillaAbierta=null;
  recalcularAgregados();
  renderSubgrupoTabs();
  renderTarjetaGrupo();
  renderTablaRapida();
  document.getElementById("zona-ranking-ger").innerHTML=`<div class="panel-placeholder">Tildá una métrica de la tarjeta para ver el ranking de cuadrillas.</div>`;
}

// Reconstruye subgrupo-tabs-wrap con los sub-tabs del grupo activo
// (ej. "Soporte Diurno"/"Soporte Nocturno", o los 4 de Construcciones).
function renderSubgrupoTabs(){
  const subs=subgruposDe(grupoActivo);
  document.getElementById("subgrupo-tabs-wrap").innerHTML=subs.map(s=>
    `<div class="subgrupo-tab ${s.key===subgrupoActivo?"subgrupo-tab-activo":""}" id="tab-sub-${s.key}" onclick="seleccionarSubgrupo('${s.key}')">${s.label}</div>`
  ).join("");
}

// Recalcula grupoAgregadoActual (todas las cuadrillas del grupo activo)
// y agregadosPorSubgrupo (uno por cada sub-tab de ese grupo), a partir
// del periodo seleccionado. Se llama al cambiar de periodo O de grupo.
function recalcularAgregados(){
  const listaEfectiva=DATA.periodos.filter(p=>p.nombre===periodoActual);
  grupoAgregadoActual=construirGrupoAgregado(listaEfectiva, grupoActivo);
  agregadosPorSubgrupo={};
  subgruposDe(grupoActivo).forEach(s=>{
    agregadosPorSubgrupo[s.key]=construirAgregadoPorSubgrupo(grupoAgregadoActual, grupoActivo, s.key);
  });
}

function labelDePeriodo(nombre){
  const p=DATA.periodos.find(p=>p.nombre===nombre);
  return p?p.label:String(nombre||"").replace(/_/g," ");
}

function calcularMedia(lista){
  if(!lista||!lista.length)return 0;
  return lista.reduce((s,v)=>s+v,0)/lista.length;
}

function sumaLista(lista){
  if(!lista||!lista.length)return 0;
  return lista.reduce((s,v)=>s+v,0);
}

function limpiarNombre(nombre){
  if(!nombre)return nombre;
  return nombre.replace(/^[\s\-–—]+/, "").replace(/[\s\-–—]*PETROSAR\s*$/i, "").trim() || nombre;
}

function parseFechaDMY(s){
  const p=s.split("/");
  return new Date(+p[2],+p[1]-1,+p[0]);
}

// Cuadrillas que, a pedido de Luise, NO forman parte del grupo Soporte
// en este dashboard (tarjeta, ranking ni evolucion), aunque figuren en
// GRUPOS["Soporte"] del pipeline. "60005824" = MED-FIS-PETROSAR-1.
const CUADRILLAS_EXCLUIDAS={
  "Soporte": ["60005824"]
};

// Campos que se suman tal cual (horas totales) al combinar cuadrillas /
// periodos. Agregar una entrada nueva aca (mas el campo correspondiente
// en el JSON real) alcanza para sumar una futura estadistica sin tocar
// el resto de esta funcion.
const CAMPOS_SUMABLES=[
  'tiempo_operativo','tiempo_traslados','tiempo_prp',
  'tiempo_novedades','tiempo_almuerzo','tiempo_charla_seguridad',
  'tiempo_varios','tiempo_espera_operativa','partes_validos',
  'cant_extension_jornada','cant_activaciones_nocturnas'
];

// Suma el grupo Soporte de 1 o varios periodos en un unico objeto, con
// las cuadrillas ya combinadas (misma tecnica que construirPeriodoAgregado
// del dashboard operativo, aca acotada al grupo Soporte para esta 1ra etapa).
// Los totales del grupo se calculan sumando las cuadrillas YA FILTRADAS
// (no los totales pre-agregados del JSON), para que una cuadrilla excluida
// tampoco pese en la tarjeta.
function construirGrupoAgregado(listaPeriodos, nombreGrupo){
  const excluidas=new Set(CUADRILLAS_EXCLUIDAS[nombreGrupo]||[]);
  const acc={ot_lista:[],cuadrillasMap:{}};
  CAMPOS_SUMABLES.forEach(f=>{acc[f]=0;});
  listaPeriodos.forEach(periodo=>{
    const g=periodo.grupos[nombreGrupo];
    if(!g)return;
    (g.cuadrillas||[]).forEach(c=>{
      if(excluidas.has(c.codigo))return;
      if(!acc.cuadrillasMap[c.codigo]){
        const base={codigo:c.codigo,nombre:c.nombre||"",servicio:c.servicio||"",base:c.base||"",ot_lista:[]};
        CAMPOS_SUMABLES.forEach(f=>{base[f]=0;});
        acc.cuadrillasMap[c.codigo]=base;
      }
      const cc=acc.cuadrillasMap[c.codigo];
      if(c.nombre)cc.nombre=c.nombre;
      if(c.servicio)cc.servicio=c.servicio;
      if(c.base)cc.base=c.base;
      CAMPOS_SUMABLES.forEach(f=>{
        cc[f]+=c[f]||0;
        acc[f]+=c[f]||0;
      });
      if(c.ot_lista){
        cc.ot_lista.push(...c.ot_lista);
        acc.ot_lista.push(...c.ot_lista);
      }
    });
  });
  acc.cuadrillas=Object.values(acc.cuadrillasMap);
  return acc;
}

// A partir del agregado COMPLETO del grupo (todas sus cuadrillas), arma
// un agregado que incluye SOLO las cuadrillas que matchean la funcion
// "match" del subgrupo pedido.
function construirAgregadoPorSubgrupo(grupoCompleto, grupo, subgrupoKey){
  const acc={ot_lista:[]};
  CAMPOS_SUMABLES.forEach(f=>{acc[f]=0;});
  cuadrillasDeSubgrupo(grupoCompleto, grupo, subgrupoKey).forEach(c=>{
    CAMPOS_SUMABLES.forEach(f=>{acc[f]+=c[f]||0;});
    if(c.ot_lista)acc.ot_lista.push(...c.ot_lista);
  });
  return acc;
}

// Cuadrillas individuales de un subgrupo puntual (para ranking/tabla).
function cuadrillasDeSubgrupo(grupoCompleto, grupo, subgrupoKey){
  const sub=subgruposDe(grupo).find(s=>s.key===subgrupoKey);
  if(!sub)return grupoCompleto.cuadrillas;
  return grupoCompleto.cuadrillas.filter(sub.match);
}

function subgruposDe(grupo){
  return SUBGRUPOS_POR_GRUPO[grupo]||[];
}

// Subgrupos de cada grupo, con su propio criterio para decidir que
// cuadrillas entran en cada uno:
// - Soporte: por SERVICIO (SOP. N. = nocturno, el resto = diurno).
// - Construcciones: por SERVICIO real de cada cuadrilla, segun
//   Servicios_para_reporte.xlsx (columnas SAP/Tablet/Servicio/Grupo) --
//   confirmado que ese campo ya distingue "Soldadores"/"Mixta"/
//   "Mecanica" exactos. "Cuadrillas de Planta" es la unica excepcion:
//   junta 3 servicios distintos (Limpieza/T. G. Pta/Volcador) que Luise
//   agrupa a mano -- para esa se usa el codigo SAP exacto en vez de
//   servicio, ya que no comparten un unico valor de servicio.
// Al escalar un grupo nuevo, alcanza con agregar su entrada aca.
const SUBGRUPOS_POR_GRUPO={
  "Soporte": [
    {key:"diurno",   label:"Soporte Diurno",   match:c=>(c.servicio||"")!=="SOP. N."},
    {key:"nocturno", label:"Soporte Nocturno", match:c=>(c.servicio||"")==="SOP. N."}
  ],
  "Construcciones": [
    {key:"soldadores", label:"Soldadores",           match:c=>(c.servicio||"")==="Soldadores"},
    {key:"mixtas",      label:"Mixtas",               match:c=>(c.servicio||"")==="Mixta"},
    {key:"mecanica",    label:"Mecánica",             match:c=>(c.servicio||"")==="Mecanica"},
    {key:"planta",      label:"Cuadrillas de Planta",
     codigos:["60000748","60000749","60001170"]}  // 404, 481-1, 481-3
  ]
};

// Convierte los subgrupos definidos por lista de CODIGOS SAP (mas
// confiable que el nombre de tablet, que puede variar de formato) en una
// funcion "match". Se hace una sola vez al cargar la pagina.
Object.values(SUBGRUPOS_POR_GRUPO).forEach(lista=>{
  lista.forEach(sub=>{
    if(sub.codigos && !sub.match){
      const set=new Set(sub.codigos);
      sub.match=c=>set.has(String(c.codigo));
    }
    if(sub.tablets && !sub.match){
      const set=new Set(sub.tablets.map(t=>t.toUpperCase()));
      sub.match=c=>set.has((limpiarNombre(c.nombre)||"").toUpperCase());
    }
  });
});


// Hs/Parte u OT/Parte para un objeto agregado (grupo o cuadrilla).
// El denominador es "partes_validos": la cantidad de partes que tuvieron
// al menos 1 fila con columna W == "0010" (operativo). Un parte SIN
// ninguna fila "0010" se omite del denominador (se divide por uno menos),
// aunque haya aportado horas a alguna de las categorias de arriba --
// pedido explicito de Luise, aplica a todas las metricas (existentes y
// nuevas). Devuelve 0 si no hay partes validos en el periodo (no se
// oculta la fila, se muestra en 0).
function valorMetrica(obj, metrica){
  // Extension de Jornada y Activaciones Nocturnas son un CONTEO directo
  // (cuantas veces ocurrio), no un promedio -- no se divide por partes_validos.
  if(metrica.key==='extension')return obj.cant_extension_jornada||0;
  if(metrica.key==='nocturna')return obj.cant_activaciones_nocturnas||0;

  const partes=obj.partes_validos||0;
  if(!partes)return 0;
  if(metrica.key==='ot')return sumaLista(obj.ot_lista)/partes;
  return (obj[metrica.campo]||0)/partes;
}

// Convierte un valor decimal de horas (ej. 3.75) al formato h:mm (ej.
// "3:45"). Solo se usa para las metricas de tiempo (Operativo, Traslado,
// PRP) -- OT/Parte queda en decimal porque es una CANTIDAD, no un tiempo.
function formatoHoraMin(valorDecimal){
  const negativo=valorDecimal<0;
  const abs=Math.abs(valorDecimal);
  let horas=Math.floor(abs);
  let minutos=Math.round((abs-horas)*60);
  if(minutos===60){minutos=0;horas+=1;}
  const minutosStr=String(minutos).padStart(2,"0");
  return (negativo?"-":"")+horas+":"+minutosStr;
}

// Texto a mostrar para un valor, segun el tipo de metrica: h:mm para las
// de tiempo; entero (sin decimales) para Extension de Jornada y
// Activaciones Nocturnas (son un conteo, no un promedio); decimal con 2
// decimales para OT/Parte (promedio diario, si es una cantidad fraccionaria).
function formatoValor(valorDecimal, metrica){
  if(metrica.key==='extension'||metrica.key==='nocturna')return String(Math.round(valorDecimal));
  return metrica.tipo==='cantidad'?valorDecimal.toFixed(2):formatoHoraMin(valorDecimal);
}

// Tabla ejecutiva de referencia rapida: todas las cuadrillas del grupo
// (incluidas SOP. N., a diferencia de la tarjeta), con TODAS las
// metricas de TIEMPO (sin OT/Dia, que queda solo en la tarjeta y el
// ranking). Se arma en forma generica a partir de METRICAS_GER, para que
// sumar una futura metrica de tiempo alcance con agregarla ahi. Se
// recalcula junto con el resto cada vez que cambia el periodo.
function renderTablaRapida(){
  const metricasTiempo=METRICAS_GER.filter(m=>m.tipo==='tiempo');

  const cabeceraMetricas=metricasTiempo.map(m=>
    `<th><div>${m.labelTabla||m.label}</div><div class="th-sub">(Hr:Min)</div></th>`
  ).join("");

  const filasHtml=cuadrillasDeSubgrupo(grupoAgregadoActual, grupoActivo, subgrupoActivo).map(c=>{
    const celdas=metricasTiempo.map(m=>`<td>${formatoValor(valorMetrica(c,m),m)}</td>`).join("");
    return `<tr>
      <td>${limpiarNombre(c.nombre)||c.codigo}</td>
      <td>${c.servicio||"-"}</td>
      <td>${c.base||"-"}</td>
      ${celdas}
    </tr>`;
  }).join("");

  const sub=subgruposDe(grupoActivo).find(s=>s.key===subgrupoActivo);
  const etiquetaSubTabla=sub?sub.label:grupoActivo;

  document.getElementById("tabla-rapida-ger").innerHTML=`
    <div class="panel-titulo">Promedio por Día Operado - ${etiquetaSubTabla} - Mes ${labelDePeriodo(periodoActual)}</div>
    <div class="tabla-rapida-box">
      <table class="tabla-rapida">
        <thead><tr>
          <th>Tablet</th><th>Servicio</th><th>Base</th>
          ${cabeceraMetricas}
        </tr></thead>
        <tbody>${filasHtml}</tbody>
      </table>
    </div>`;
}

function cambiarPeriodoGerencia(valor){
  periodoActual=valor;
  cuadrillaAbierta=null;
  recalcularAgregados();
  renderTarjetaGrupo();
  renderTablaRapida();
  if(metricaAbierta)renderRanking(metricaAbierta);
  else{
    document.getElementById("zona-ranking-ger").innerHTML=`<div class="panel-placeholder">Tildá una métrica de la tarjeta para ver el ranking de cuadrillas.</div>`;
  }
}

// Selector de sub-tab (ej. Soporte Diurno/Nocturno, o Soldadores/Mixtas/
// Mecánica/Cuadrillas de Planta en Construcciones): cambia que tarjeta
// se ve a la izquierda Y a que cuadrillas quedan acotados la tabla y el
// ranking de la derecha.
function seleccionarSubgrupo(key){
  if(subgrupoActivo===key)return;
  subgrupoActivo=key;
  metricaAbierta=null;
  cuadrillaAbierta=null;
  document.querySelectorAll(".subgrupo-tab").forEach(el=>el.classList.remove("subgrupo-tab-activo"));
  const activo=document.getElementById("tab-sub-"+key);
  if(activo)activo.classList.add("subgrupo-tab-activo");
  renderTarjetaGrupo();
  renderTablaRapida();
  document.getElementById("zona-ranking-ger").innerHTML=`<div class="panel-placeholder">Tildá una métrica de la tarjeta para ver el ranking de cuadrillas.</div>`;
}

function renderTarjetaGrupo(){
  const metricasTiempo=METRICAS_GER.filter(m=>m.tipo==='tiempo');
  const metricasCantidad=METRICAS_GER.filter(m=>m.tipo==='cantidad');

  // Arma la tarjeta completa (tiempos + burbuja de cantidades) para el
  // sub-tab actualmente seleccionado (subgrupoActivo) del grupo activo,
  // sobre el agregado que corresponda. Solo se muestra UNA tarjeta a la
  // vez -- las demas se ven cambiando el sub-tab de arriba.
  const sub=subgruposDe(grupoActivo).find(s=>s.key===subgrupoActivo);
  const agregado=agregadosPorSubgrupo[subgrupoActivo];
  const nombreCard=sub?sub.label:grupoActivo;
  const tituloSeccion=`Tiempos Diarios de ${nombreCard}`;

  const construirFila=(m)=>{
    const v=valorMetrica(agregado,m);
    const chequeado=metricaAbierta===m.key?"checked":"";
    return `<div class="fila-metrica">
      <label><input type="checkbox" ${chequeado} onchange="toggleMetrica('${m.key}')"/> ${m.label}</label>
      <span class="valor">${formatoValor(v,m)}</span>
    </div>`;
  };
  const filasTiempo=metricasTiempo.map(construirFila).join("");
  const filasCantidad=metricasCantidad.map(construirFila).join("");
  const totalTiempo=metricasTiempo.reduce((s,m)=>s+valorMetrica(agregado,m),0);

  document.getElementById("tarjeta-soporte").innerHTML=`
    <div class="grupo-card card-soporte">
      <div class="grupo-header"><span class="grupo-dot"></span><span class="grupo-nombre">${nombreCard}</span></div>
      <div class="tarjeta-seccion-header">
        <span class="titulo-seccion">${tituloSeccion}</span>
        <span class="col-header"><div>Hs / Parte</div><div class="th-sub">(Hr:Min)</div></span>
      </div>
      ${filasTiempo}
      <div class="fila-metrica fila-total">
        <label>Total</label>
        <span class="valor">${formatoHoraMin(totalTiempo)}</span>
      </div>
    </div>
    <div class="grupo-card card-soporte tarjeta-ot-bubble">
      ${filasCantidad}
    </div>`;
}

let cuadrillaAbierta=null;

function toggleMetrica(key){
  metricaAbierta=metricaAbierta===key?null:key;
  cuadrillaAbierta=null;
  renderTarjetaGrupo();
  if(metricaAbierta)renderRanking(metricaAbierta);
  else document.getElementById("zona-ranking-ger").innerHTML=`<div class="panel-placeholder">Tildá una métrica de la tarjeta para ver el ranking de cuadrillas.</div>`;
}

// Ranking con las cuadrillas del TURNO ACTIVO (diurno: 5 cuadrillas
// SOP. D.; nocturno: solo 131 y 363, SOP. N.), con barra horizontal
// proporcional al valor. Al hacer click en una fila, la evolucion
// mensual de esa cuadrilla se inserta INMEDIATAMENTE DEBAJO de esa
// misma fila (empujando el resto del ranking hacia abajo), dejando bien
// claro a que cuadrilla corresponde.
function renderRanking(key){
  const metrica=METRICAS_GER.find(m=>m.key===key);
  const cuadrillasSub=cuadrillasDeSubgrupo(grupoAgregadoActual, grupoActivo, subgrupoActivo);
  let filas=cuadrillasSub.map(c=>Object.assign({}, c, {valor:valorMetrica(c,metrica)}));
  filas.sort((a,b)=>metrica.ordenPeorPrimero==='desc'?b.valor-a.valor:a.valor-b.valor);

  const etiquetaPeriodo=labelDePeriodo(periodoActual);
  const sub=subgruposDe(grupoActivo).find(s=>s.key===subgrupoActivo);
  const etiquetaSub=sub?sub.label:grupoActivo;
  const maxVal=Math.max(...filas.map(f=>f.valor),0.0001);

  const filasHtml=filas.map((c,i)=>{
    const pct=(c.valor/maxVal*100).toFixed(1);
    const activa=cuadrillaAbierta===c.codigo?"ranking-row-activa":"";
    const fila=`
    <div class="ranking-row ${activa}" onclick="toggleTrend('${c.codigo}','${key}')">
      <span class="num">${i+1}</span>
      <span>${limpiarNombre(c.nombre)||c.codigo}</span>
      <span>${c.servicio||"-"}</span>
      <span>${c.base||"-"}</span>
      <div class="ranking-bar-track"><div class="ranking-bar-fill" style="width:${pct}%"></div></div>
      <span class="valor">${formatoValor(c.valor,metrica)}</span>
    </div>`;
    const trend=cuadrillaAbierta===c.codigo?construirTrendInline(c,metrica):"";
    return fila+trend;
  }).join("");

  const subUnidad=metrica.tipo==='cantidad'?'':'<div class="th-sub">(Hr:Min)</div>';

  document.getElementById("zona-ranking-ger").innerHTML=`
    <div class="panel-ranking">
      <div class="panel-titulo">Ranking - "${metrica.label}" - ${etiquetaSub} - Promedio por Día Operado - Periodo: "${etiquetaPeriodo}"</div>
      <div class="ranking-box">
        <div class="ranking-header"><span></span><span>Tablet</span><span>Servicio</span><span>Base</span><span></span><span style="text-align:center">${metrica.colRanking}${subUnidad}</span></div>
        ${filasHtml}
      </div>
    </div>`;
}

function toggleTrend(codigo, key){
  cuadrillaAbierta=cuadrillaAbierta===codigo?null:codigo;
  renderRanking(key);
}

// Evolucion mensual en barras VERTICALES para UNA cuadrilla puntual,
// identificada bien claro en el titulo (tablet + servicio + base) para
// que quede sin ambiguedad a quien corresponde el grafico. Recorre TODOS
// los periodos disponibles en DATA.periodos, en orden cronologico,
// arrancando en Marzo_26 y sumando un mes mas cada vez que se cierra una
// certificacion (no hay meses fijos "a mano"). Rolling de 12 meses: una
// vez que hay mas de 12 periodos cargados, se muestran solo los ultimos
// 12. Se muestran TODOS los periodos del rango, con 0 si la cuadrilla no
// tuvo partes ese mes.
const MAX_MESES_TREND=12;

function construirTrendInline(cuadrilla, metrica){
  let periodosOrdenados=[...DATA.periodos].sort((a,b)=>parseFechaDMY(a.fecha_inicio)-parseFechaDMY(b.fecha_inicio));
  if(periodosOrdenados.length>MAX_MESES_TREND){
    periodosOrdenados=periodosOrdenados.slice(periodosOrdenados.length-MAX_MESES_TREND);
  }

  const filas=periodosOrdenados.map(periodo=>{
    const g=periodo.grupos[grupoActivo];
    const c=g?(g.cuadrillas||[]).find(x=>x.codigo===cuadrilla.codigo):null;
    const v=c?valorMetrica(c,metrica):0;
    return {label:periodo.label, valor:v};
  });

  const max=Math.max(...filas.map(f=>f.valor),0.0001);
  const alturas=filas.map(f=>Math.max((f.valor/max*100),2));
  const nombreCuadrilla=limpiarNombre(cuadrilla.nombre)||cuadrilla.codigo;

  return `<div class="trend-inline">
    <div class="trend-inline-titulo">Evolucion mensual &middot; ${metrica.label} &middot; Tablet ${nombreCuadrilla} (${cuadrilla.servicio||"-"} &middot; Base ${cuadrilla.base||"-"})</div>
    <div class="trend-vert-wrap">
      ${filas.map((f,i)=>`<div class="trend-bar-col">
        <div class="trend-bar-valor">${formatoValor(f.valor,metrica)}</div>
        <div class="trend-bar" style="height:${alturas[i]}%"></div>
        <div class="trend-bar-label">${f.label}</div>
      </div>`).join("")}
    </div>
  </div>`;
}

// Selector de periodo: SOLO meses (sin Acumulado -- Dashboard Gerencia
// trabaja unicamente con valores mensuales). Se ordenan cronologicamente
// y se selecciona por defecto el mes mas reciente disponible.
const selGer=document.getElementById("selector-periodo-ger");
const periodosOrdenadosSelector=[...DATA.periodos].sort((a,b)=>parseFechaDMY(a.fecha_inicio)-parseFechaDMY(b.fecha_inicio));
periodosOrdenadosSelector.forEach(p=>{
  const opt=document.createElement("option");
  opt.value=p.nombre;
  opt.textContent=p.label;
  selGer.appendChild(opt);
});
const periodoDefault=periodosOrdenadosSelector.length?periodosOrdenadosSelector[periodosOrdenadosSelector.length-1].nombre:null;
selGer.value=periodoDefault;
renderSubgrupoTabs();
cambiarPeriodoGerencia(periodoDefault);

// Cache-busting: fuerza recarga si el parametro ?v= no coincide con la
// version embebida (mismo mecanismo que usa dashboard_sap.html). Evita
// que GitHub Pages / el navegador sigan mostrando una version vieja
// cacheada despues de actualizar el archivo.
(function(){
  const VERSION="202608041254";
  const params=new URLSearchParams(window.location.search);
  if(params.get("v")!==VERSION){
    params.set("v",VERSION);
    window.location.replace(window.location.pathname+"?"+params.toString());
  }
})();
</script>
