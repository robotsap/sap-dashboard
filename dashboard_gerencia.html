const VALOR_ACUMULADO="__ACUMULADO__";

// ordenPeorPrimero: 'asc' = el valor mas bajo aparece primero (peor);
// 'desc' = el valor mas alto aparece primero (peor). Confirmado con Luise.
const METRICAS_GER=[
  {key:'operativo',  label:'Tiempo operativo',    campo:'tiempo_operativo', ordenPeorPrimero:'asc',  colRanking:'Hs / Parte'},
  {key:'traslado',   label:'Tiempo de traslado',   campo:'tiempo_traslados', ordenPeorPrimero:'desc', colRanking:'Hs / Parte'},
  {key:'prp',        label:'Tiempo de PRP',        campo:'tiempo_prp',       ordenPeorPrimero:'desc', colRanking:'Hs / Parte'},

];

let periodoActual=VALOR_ACUMULADO;
let metricaAbierta=null;
let grupoAgregadoSoporte=null;

function calcularMedia(lista){
  if(!lista||!lista.length)return 0;
  return lista.reduce((s,v)=>s+v,0)/lista.length;
}

function limpiarNombre(nombre){
  if(!nombre)return nombre;
  return nombre.replace(/^[\s\-–—]+/, "").replace(/[\s\-–—]*PETROSAR\s*$/i, "").trim() || nombre;
}

function parseFechaDMY(s){
  const p=s.split("/");
  return new Date(+p[2],+p[1]-1,+p[0]);
}

// Cuadrillas que, a pedido de Luise, NO forman parte del grupo Soporte
// en este dashboard (tarjeta, ranking ni evolucion), aunque figuren en
// GRUPOS["Soporte"] del pipeline. "60005824" = MED-FIS-PETROSAR-1.
const CUADRILLAS_EXCLUIDAS={
  "Soporte": ["60005824"]
};

// Suma el grupo Soporte de 1 o varios periodos en un unico objeto, con
// las cuadrillas ya combinadas (misma tecnica que construirPeriodoAgregado
// del dashboard operativo, aca acotada al grupo Soporte para esta 1ra etapa).
// Los totales del grupo se calculan sumando las cuadrillas YA FILTRADAS
// (no los totales pre-agregados del JSON), para que una cuadrilla excluida
// tampoco pese en la tarjeta.
function construirGrupoAgregado(listaPeriodos, nombreGrupo){
  const excluidas=new Set(CUADRILLAS_EXCLUIDAS[nombreGrupo]||[]);
  const acc={tiempo_operativo:0,tiempo_traslados:0,tiempo_prp:0,ot_lista:[],cuadrillasMap:{}};
  listaPeriodos.forEach(periodo=>{
    const g=periodo.grupos[nombreGrupo];
    if(!g)return;
    (g.cuadrillas||[]).forEach(c=>{
      if(excluidas.has(c.codigo))return;
      if(!acc.cuadrillasMap[c.codigo]){
        acc.cuadrillasMap[c.codigo]={codigo:c.codigo,nombre:c.nombre||"",servicio:c.servicio||"",base:c.base||"",
          tiempo_operativo:0,tiempo_traslados:0,tiempo_prp:0,ot_lista:[]};
      }
      const cc=acc.cuadrillasMap[c.codigo];
      if(c.nombre)cc.nombre=c.nombre;
      if(c.servicio)cc.servicio=c.servicio;
      if(c.base)cc.base=c.base;
      cc.tiempo_operativo+=c.tiempo_operativo||0;
      cc.tiempo_traslados+=c.tiempo_traslados||0;
      cc.tiempo_prp+=c.tiempo_prp||0;
      if(c.ot_lista)cc.ot_lista.push(...c.ot_lista);

      acc.tiempo_operativo+=c.tiempo_operativo||0;
      acc.tiempo_traslados+=c.tiempo_traslados||0;
      acc.tiempo_prp+=c.tiempo_prp||0;
      if(c.ot_lista)acc.ot_lista.push(...c.ot_lista);
    });
  });
  acc.cuadrillas=Object.values(acc.cuadrillasMap);
  return acc;
}


// Hs/Parte u OT/Parte para un objeto agregado (grupo o cuadrilla).
// Devuelve 0 si no hay partes en el periodo seleccionado (no se oculta
// la fila, se muestra en 0 — pedido explicito de Luise).
function valorMetrica(obj, metrica){
  const partes=(obj.ot_lista||[]).length;
  if(metrica.key==='ot')return partes?calcularMedia(obj.ot_lista):0;
  if(!partes)return 0;
  return obj[metrica.campo]/partes;
}

function cambiarPeriodoGerencia(valor){
  periodoActual=valor;
  const lista=valor===VALOR_ACUMULADO?DATA.periodos:DATA.periodos.filter(p=>p.nombre===valor);
  const listaEfectiva=lista.length?lista:DATA.periodos;
  grupoAgregadoSoporte=construirGrupoAgregado(listaEfectiva,"Soporte");
  renderTarjetaSoporte();
  if(metricaAbierta)renderRanking(metricaAbierta);
  else{
    document.getElementById("panel-der-ger").innerHTML=`<div class="panel-placeholder">Tildá una métrica de la tarjeta para ver el ranking de cuadrillas.</div>`;
  }
}

function renderTarjetaSoporte(){
  const filas=METRICAS_GER.map(m=>{
    const v=valorMetrica(grupoAgregadoSoporte,m);
    const chequeado=metricaAbierta===m.key?"checked":"";
    const texto=m.key==='ot'?v.toFixed(2):v.toFixed(2)+" hs / parte";
    return `<div class="fila-metrica">
      <label><input type="checkbox" ${chequeado} onchange="toggleMetrica('${m.key}')"/> ${m.label}</label>
      <span class="valor">${texto}</span>
    </div>`;
  }).join("");

  document.getElementById("tarjeta-soporte").innerHTML=`
    <div class="grupo-card card-soporte">
      <div class="grupo-header"><span class="grupo-dot"></span><span class="grupo-nombre">Soporte</span></div>
      ${filas}
    </div>`;
}

function toggleMetrica(key){
  metricaAbierta=metricaAbierta===key?null:key;
  renderTarjetaSoporte();
  if(metricaAbierta)renderRanking(metricaAbierta);
  else document.getElementById("panel-der-ger").innerHTML=`<div class="panel-placeholder">Tildá una métrica de la tarjeta para ver el ranking de cuadrillas.</div>`;
}

// Ranking con TODAS las cuadrillas del grupo (aunque tengan 0), con barra
// horizontal proporcional al valor — igual criterio visual que el
// dashboard operativo.
function renderRanking(key){
  const metrica=METRICAS_GER.find(m=>m.key===key);
  let filas=grupoAgregadoSoporte.cuadrillas.map(c=>Object.assign({}, c, {valor:valorMetrica(c,metrica)}));
  filas.sort((a,b)=>metrica.ordenPeorPrimero==='desc'?b.valor-a.valor:a.valor-b.valor);

  const etiquetaPeriodo=periodoActual===VALOR_ACUMULADO?"Acumulado (Todo)":periodoActual.replace(/_/g," ");
  const maxVal=Math.max(...filas.map(f=>f.valor),0.0001);

  const filasHtml=filas.map((c,i)=>{
    const pct=(c.valor/maxVal*100).toFixed(1);
    return `
    <div class="ranking-row" onclick="mostrarTrend('${c.codigo}','${key}')">
      <span class="num">${i+1}</span>
      <span>${limpiarNombre(c.nombre)||c.codigo}</span>
      <span>${c.servicio||"-"}</span>
      <span>${c.base||"-"}</span>
      <div class="ranking-bar-track"><div class="ranking-bar-fill" style="width:${pct}%"></div></div>
      <span class="valor">${c.valor.toFixed(2)}</span>
    </div>`;
  }).join("");

  document.getElementById("panel-der-ger").innerHTML=`
    <div class="panel-ranking">
      <div class="panel-titulo">Ranking &middot; ${metrica.label} &middot; peor a mejor &middot; Periodo: ${etiquetaPeriodo}</div>
      <div class="ranking-box">
        <div class="ranking-header"><span></span><span>Tablet</span><span>Servicio</span><span>Base</span><span></span><span style="text-align:right">${metrica.colRanking}</span></div>
        ${filasHtml}
      </div>
    </div>
    <div id="panel-trend-ger"></div>`;
}

// Evolucion mensual en barras VERTICALES. Recorre TODOS los periodos
// disponibles en DATA.periodos, en orden cronologico, arrancando en
// Marzo_26 y sumando un mes mas cada vez que se cierra una certificacion
// (no hay meses fijos "a mano"). Rolling de 12 meses: una vez que hay mas
// de 12 periodos cargados, se muestran solo los ultimos 12 (los mas viejos
// se van corriendo). Se muestran TODOS los periodos del rango, con 0 si la
// cuadrilla no tuvo partes ese mes.
const MAX_MESES_TREND=12;

function mostrarTrend(codigo, key){
  const metrica=METRICAS_GER.find(m=>m.key===key);

  let periodosOrdenados=[...DATA.periodos].sort((a,b)=>parseFechaDMY(a.fecha_inicio)-parseFechaDMY(b.fecha_inicio));
  if(periodosOrdenados.length>MAX_MESES_TREND){
    periodosOrdenados=periodosOrdenados.slice(periodosOrdenados.length-MAX_MESES_TREND);
  }

  const filas=periodosOrdenados.map(periodo=>{
    const g=periodo.grupos["Soporte"];
    const c=g?(g.cuadrillas||[]).find(x=>x.codigo===codigo):null;
    const v=c?valorMetrica(c,metrica):0;
    return {label:periodo.label, valor:v};
  });

  const max=Math.max(...filas.map(f=>f.valor),0.0001);
  const alturas=filas.map(f=>Math.max((f.valor/max*100),2));

  const panel=document.getElementById("panel-trend-ger");
  panel.innerHTML=`
    <div class="panel-titulo">Evolucion mensual &middot; ${metrica.label}</div>
    <div class="trend-vert-box">
      <div class="trend-vert-wrap">
        ${filas.map((f,i)=>`<div class="trend-bar-col">
          <div class="trend-bar-valor">${f.valor.toFixed(2)}</div>
          <div class="trend-bar" style="height:${alturas[i]}%"></div>
          <div class="trend-bar-label">${f.label}</div>
        </div>`).join("")}
      </div>
    </div>`;
}

// Selector de periodo: Acumulado + 1 opcion por cada mes disponible en DATA
// (mismos 6 periodos 21->20 que ya usa el dashboard operativo).
const selGer=document.getElementById("selector-periodo-ger");
const optAcum=document.createElement("option");
optAcum.value=VALOR_ACUMULADO;
optAcum.textContent="Acumulado (Todo)";
selGer.appendChild(optAcum);
DATA.periodos.forEach(p=>{
  const opt=document.createElement("option");
  opt.value=p.nombre;
  opt.textContent=p.label;
  selGer.appendChild(opt);
});
selGer.value=VALOR_ACUMULADO;
cambiarPeriodoGerencia(VALOR_ACUMULADO);
</script>
