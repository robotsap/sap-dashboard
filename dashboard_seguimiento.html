<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Seguimiento de Descuentos, Reclamos y Acciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F2; --surface:#FFFFFF; --border:#E7E3DA;
    --accent:#B5541C; --accent-soft:#FBE9DD;
    --ink:#17181C; --ink-soft:#6B7280; --muted:#9CA3AF;
    --ok:#276749; --ok-soft:#E1F3E7;
    --danger:#C0392B; --danger-soft:#FBEAE7;
    --progress:#B7791F; --progress-soft:#FCF1D8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
  .num{font-family:'DM Mono',monospace;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:28px 36px 18px;}
  .header-top{display:flex;align-items:flex-start;gap:16px;}
  .logo{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px;}
  h1{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  h1 .accent{color:var(--accent);}
  .desc{color:var(--ink-soft);font-size:13.5px;max-width:640px;line-height:1.5;margin:0;}
  .periodos{display:flex;gap:8px;flex-wrap:wrap;padding:18px 36px 4px;}
  .pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:8px 16px;cursor:pointer;font-size:13px;}
  .pill .pill-sub{color:var(--ink-soft);font-size:11px;margin-left:6px;}
  .pill.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;}
  main{padding:20px 36px 48px;max-width:1100px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .kpi.aviso{border-color:var(--danger);background:var(--danger-soft);}
  .kpi-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .kpi-valor{font-size:30px;font-weight:700;color:var(--accent);}
  .kpi.aviso .kpi-valor{color:var(--danger);}
  .kpi-sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .vacio{padding:48px 24px;text-align:center;color:var(--ink-soft);background:var(--surface);border:1px solid var(--border);border-radius:14px;}
</style>
</head>
<body>

    <div>
      <div class="eyebrow">PETROSAR</div>
      <h1>Seguimiento de Descuentos, <span class="accent">Reclamos y Acciones</span></h1>
      <p class="desc">Estado de gestión de los descuentos operativos: cuántos fueron reclamados, cuántos tuvieron una acción correctiva y cuántos siguen sin gestionar.</p>
    </div>
  </div>
</header>

<div class="periodos" id="periodos"></div>

<main id="main"><div class="vacio">Cargando…</div></main>

<script>
const DATA = {"generado": "10/09/2026 10:40", "periodos": []};

let periodoActual = DATA.periodos.length ? DATA.periodos[DATA.periodos.length - 1].nombre : null;

function pintarPeriodos() {
  const cont = document.getElementById('periodos');
  cont.innerHTML = '';
  DATA.periodos.forEach(p => {
    const el = document.createElement('div');
    el.className = 'pill' + (p.nombre === periodoActual ? ' active' : '');
    el.innerHTML = p.label + '<span class="pill-sub">' + p.total_descuentos + 'd · ' + p.total_horas.toFixed(1) + 'h</span>';
    el.onclick = () => { periodoActual = p.nombre; pintarPeriodos(); pintarKpis(); };
    cont.appendChild(el);
  });
}

function pintarKpis() {
  const main = document.getElementById('main');
  const p = DATA.periodos.find(x => x.nombre === periodoActual);
  if (!p) { main.innerHTML = '<div class="vacio">No hay datos de seguimiento para este período todavía.</div>'; return; }

  const pctReclamado = p.total_horas ? (100 * p.horas_reclamado / p.total_horas) : 0;
  const pctAccion = p.total_horas ? (100 * p.horas_accion / p.total_horas) : 0;
  const pctSinGestionar = p.total_horas ? (100 * p.horas_sin_gestionar / p.total_horas) : 0;
  const pctCerrado = p.total_horas ? (100 * p.horas_cerrado / p.total_horas) : 0;

  main.innerHTML = `
    <div class="grid">
      <div class="kpi">
        <div class="kpi-label">Horas Descontadas</div>
        <div class="kpi-valor num">${p.total_horas.toFixed(1)}h</div>
        <div class="kpi-sub">${p.total_descuentos} descuentos</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">% Reclamado</div>
        <div class="kpi-valor num">${pctReclamado.toFixed(1)}%</div>
        <div class="kpi-sub">${p.cant_reclamado} descuentos · ${p.horas_reclamado.toFixed(1)}h</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">% Con Acción Correctiva</div>
        <div class="kpi-valor num">${pctAccion.toFixed(1)}%</div>
        <div class="kpi-sub">${p.cant_accion} descuentos · ${p.horas_accion.toFixed(1)}h</div>
      </div>
      <div class="kpi aviso">
        <div class="kpi-label">% Sin Gestionar</div>
        <div class="kpi-valor num">${pctSinGestionar.toFixed(1)}%</div>
        <div class="kpi-sub">${p.cant_sin_gestionar} descuentos · ${p.horas_sin_gestionar.toFixed(1)}h</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">% Cerrado</div>
        <div class="kpi-valor num">${pctCerrado.toFixed(1)}%</div>
        <div class="kpi-sub">${p.cant_cerrado} descuentos · ${p.horas_cerrado.toFixed(1)}h</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Horas Devueltas</div>
        <div class="kpi-valor num">${p.horas_devueltas.toFixed(1)}h</div>
        <div class="kpi-sub">de reclamos exitosos</div>
      </div>
    </div>`;
}

if (DATA.periodos.length) {
  pintarPeriodos();
  pintarKpis();
} else {
  document.getElementById('main').innerHTML = '<div class="vacio">Todavía no hay períodos con datos en Seguimiento de Descuentos.</div>';
}
</script>
</body>
</html>
